<div class="container">
  <div style="text-align: center; margin: 5%">
    <h1>{{ title }}</h1>
  </div>
  <div>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
            <ng-container matColumnDef = "c1">
                <th mat-header-cell *matHeaderCellDef>No.</th>
                <td mat-cell *matCellDef="let element">{{ element.question_id }}</td>
            </ng-container>

            <ng-container matColumnDef = "c2">
                <th mat-header-cell *matHeaderCellDef>Pregunta</th>
                <td mat-cell *matCellDef="let element">{{ element.question_text }}</td>
            </ng-container>

            <ng-container matColumnDef = "c3">
                <th mat-header-cell *matHeaderCellDef>Cuestionario</th>
                <td mat-cell *matCellDef="let element">{{ element.questionnaire.title }}</td>
            </ng-container>

       <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    @if (Results) {
  <div class="no-results">{{ mensaje }}</div>
}
  </div>
</div>
