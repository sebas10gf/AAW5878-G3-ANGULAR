<div class="container">
  @if(verificar()) {
    <mat-toolbar class = "custom-toolbar">
      <button mat-button [routerLink]="['/homes']" class = "btn-rojo">
        <mat-icon>home</mat-icon>Home
      </button>

      @if(isAdmin()) {
        <button class="btn-rojo"
          matButton
          aria-label="Example icon-button with menu icon"
          [matMenuTriggerFor]="menuUsers" >
          <mat-icon>person</mat-icon>Usuarios
        </button>

        <button class="btn-rojo"
          matButton
          aria-label="Example icon-button with menu icon"
          [matMenuTriggerFor]="menuCuestionarios" >
          <mat-icon>article</mat-icon>Cuestionarios
        </button>

        <button class="btn-rojo"
          matButton
          aria-label="Example icon-button with menu icon"
          [matMenuTriggerFor]="menuPre" >
          <mat-icon>description</mat-icon>Preguntas
        </button>

        <button class="btn-rojo"
          matButton
          aria-label="Example icon-button with menu icon"
          [matMenuTriggerFor]="menuRes" >
          <mat-icon>description</mat-icon>Respuestas
        </button>

        <button class="btn-rojo"
          matButton
          aria-label="Example icon-button with menu icon"
          [matMenuTriggerFor]="menuRoles" >
          <mat-icon>assessment</mat-icon>Roles
        </button>
         <button class="btn-rojo"
          matButton
          aria-label="Example icon-button with menu icon"
          [matMenuTriggerFor]="menuLink" >
          <mat-icon>assessment</mat-icon>LinkedProf
        </button>
      }

      @if(isProfesional()) {
        <button class="btn-rojo"
          matButton
          aria-label="Example icon-button with menu icon"
          [matMenuTriggerFor]="menuGoal" >
          <mat-icon>assignment_turned_in</mat-icon>Goals
        </button>

        <button class="btn-rojo"
          matButton
          aria-label="Example icon-button with menu icon"
          [matMenuTriggerFor]="menuLog" >
          <mat-icon>description</mat-icon>Sintomas
        </button>

        <button class="btn-rojo"
          matButton
          aria-label="Example icon-button with menu icon"
          [matMenuTriggerFor]="menuPred" >
          <mat-icon>description</mat-icon>Predicciones
        </button>
      }
      <span class = "spacer"> </span>

      <button class = "btn-rojo" 
        mat-button 
        aria-label = "Exmaple icon-button with menu icon"
        [matMenuTriggerFor]="menuSalir">
          <mat-icon>person</mat-icon>
          {{usuario}}
          </button>
      </mat-toolbar>
  }

<mat-menu #menuUsers="matMenu">
  <button mat-menu-item routerLink="/Users"><mat-icon>list</mat-icon>Listar</button>
  <button mat-menu-item routerLink="/Users/news"> <mat-icon>add</mat-icon>Registrar</button>
</mat-menu>
<mat-menu #menuCuestionarios="matMenu">
  <button mat-menu-item routerLink="/Questionnaries"><mat-icon>list</mat-icon>Listar</button>
  <button mat-menu-item routerLink="/Questionnaries/news"><mat-icon>add</mat-icon>Registrar</button>
</mat-menu>
<mat-menu #menuRoles="matMenu">
  <button mat-menu-item routerLink="/Roles"><mat-icon>list</mat-icon>Listar</button>
  <button mat-menu-item routerLink="/Roles/news"><mat-icon>add</mat-icon>Registrar</button>
</mat-menu>
<mat-menu #menuLink="matMenu">
  <button mat-menu-item routerLink="/LinkedProfile"><mat-icon>list</mat-icon>Listar</button>
  <button mat-menu-item routerLink="/LinkedProfile/news"><mat-icon>add</mat-icon>Registrar</button>
</mat-menu>
<mat-menu #menuGoal="matMenu">
  <button mat-menu-item routerLink="/Goal"><mat-icon>list</mat-icon>Listar</button>
  <button mat-menu-item routerLink="/Goal/news"><mat-icon>add</mat-icon>Registrar</button>
</mat-menu>
<mat-menu #menuLog="matMenu">
  <button mat-menu-item routerLink="/SymptomsLog"><mat-icon>list</mat-icon>Listar</button>
  <button mat-menu-item routerLink="/SymptomsLog/news"><mat-icon>add</mat-icon>Registrar</button>
</mat-menu>
<mat-menu #menuPre="matMenu">
  <button mat-menu-item routerLink="/Questions"><mat-icon>list</mat-icon>Listar</button>
  <button mat-menu-item routerLink="/Questions/news"><mat-icon>add</mat-icon>Registrar</button>
</mat-menu>
<mat-menu #menuRes="matMenu">
  <button mat-menu-item routerLink="/QuestionsAnswers"><mat-icon>list</mat-icon>Listar</button>
  <button mat-menu-item routerLink="/QuestionsAnswers/news"><mat-icon>add</mat-icon>Registrar</button>
</mat-menu>
<mat-menu #menuPred="matMenu">
  <button mat-menu-item routerLink="/Prediction"><mat-icon>list</mat-icon>Listar</button>
  <button mat-menu-item routerLink="/Prediction/news"><mat-icon>add</mat-icon>Registrar</button>
</mat-menu>
<mat-menu #menuSalir="matMenu">
  <button mat-menu-item routerLink="/login" (click)="cerrar()">
    <mat-icon>logout</mat-icon>
    <span>Cerrar sesión</span>
  </button>
  <button mat-menu-item>
    Rol:
    <span>{{ role }}</span>
  </button>
</mat-menu>
</div>
