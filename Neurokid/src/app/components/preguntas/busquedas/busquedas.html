<div class="container">
  <div style="text-align: center; margin: 5%">
    <h1>Buscar por cuestionario</h1>
  </div>
  <div class="search-container">
    <form [formGroup]="form">
      <mat-form-field class="example-full-width">
        <mat-label>Ingrese nombre de cuestionario </mat-label>
        <input matInput formControlName="nombrebusqueda" />
      </mat-form-field>
    </form>
  </div>
  <div>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
            <ng-container matColumnDef = "c1">
                <th mat-header-cell *matHeaderCellDef>No.</th>
                <td mat-cell *matCellDef="let element">{{ element.question_id }}</td>
            </ng-container>

            <ng-container matColumnDef = "c2">
                <th mat-header-cell *matHeaderCellDef>Pregunta</th>
                <td mat-cell *matCellDef="let element">{{ element.question_text }}</td>
            </ng-container>

            <ng-container matColumnDef = "c3">
                <th mat-header-cell *matHeaderCellDef>Cuestionario</th>
                <td mat-cell *matCellDef="let element">{{ element.questionnaire.title }}</td>
            </ng-container>

       <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    @if (Results) {
  <div class="no-results">No se encontraron registros que coincidan con tu búsqueda.</div>
}
  </div>
</div>
